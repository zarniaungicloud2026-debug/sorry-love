<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You 💗</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  background: linear-gradient(135deg, #ffd6e7, #fff5f9);
  font-family: Arial, sans-serif;
}

.heart {
  position: fixed;
  bottom: -50px;
  font-size: 25px;
  animation: float 5s linear forwards;
  pointer-events: none;
}

@keyframes float {
  0% {
    transform: translateY(0) scale(0.7);
    opacity: 0;
  }

  20% {
    opacity: 1;
  }

  100% {
    transform: translateY(-110vh) rotate(25deg) scale(1.3);
    opacity: 0;
  }
}

.container {
  position: relative;
  z-index: 10;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.card {
  width: 85%;
  max-width: 400px;
  padding: 35px 22px;
  border-radius: 30px;
  background: rgba(255,255,255,0.85);
  box-shadow: 0 10px 40px rgba(255,80,140,0.2);
}

h1 {
  color: #ff5795;
}

p {
  color: #555;
  line-height: 1.8;
}

button {
  border: none;
  padding: 14px 25px;
  border-radius: 30px;
  background: #ff6fa8;
  color: white;
  font-size: 17px;
  margin-top: 10px;
}

#secret {
  display: none;
  margin-top: 20px;
  color: #ff5795;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">
  <div class="card">

    <div style="font-size:55px;">💗</div>

    <h1>ဟေး... 🥺</h1>

    <p>
      စိတ်မဆိုးနဲ့နော်...<br>
      ငါ့ကြောင့် မင်းစိတ်မကောင်းဖြစ်သွားရင်
      တကယ်တောင်းပန်ပါတယ်။ 💕
    </p>

    <button onclick="forgive()">
      ဒီခလုတ်လေးနှိပ် 🥺💗
    </button>

    <div id="secret">
      ကျေးဇူးတင်ပါတယ် 🥺💗<br><br>
      မင်းပြုံးနေတာကိုပဲ မြင်ချင်တာပါ။
    </div>

  </div>
</div>

<script>

function createHeart() {

  const heart = document.createElement("div");

  heart.className = "heart";

  const hearts = ["💗","💖","💕","💘","💝","❤️"];

  heart.innerHTML =
    hearts[Math.floor(Math.random() * hearts.length)];

  heart.style.left =
    Math.random() * 100 + "vw";

  heart.style.fontSize =
    (18 + Math.random() * 25) + "px";

  heart.style.animationDuration =
    (4 + Math.random() * 4) + "s";

  document.body.appendChild(heart);

  setTimeout(() => {
    heart.remove();
  }, 8000);
}

setInterval(createHeart, 350);

function forgive() {

  document.getElementById("secret").style.display = "block";

  for(let i = 0; i < 30; i++) {
    setTimeout(createHeart, i * 80);
  }
}

</script>

</body>
</html>
